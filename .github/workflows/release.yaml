name: Release benchmark artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.13'

      - name: Run repository release gates
        shell: bash
        run: make preflight

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            ./scripts/release-build.sh --tag "$GITHUB_REF_NAME" --commit "$release_commit"
          else
            ./scripts/release-build.sh --tag snapshot --commit "$GITHUB_SHA" --snapshot
          fi

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

  image:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1

      - name: Confirm the installed builder version
        shell: bash
        run: docker buildx version | grep -F 'v0.36.1'

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - id: publish
        name: Build and publish the multi-architecture runner image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/luckypipewrench/agent-egress-bench-runner:$GITHUB_REF_NAME"
          metadata_file="$RUNNER_TEMP/aeb-image-metadata.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "AEB_VERSION=$version" \
            --build-arg "AEB_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image" \
            --metadata-file "$metadata_file" \
            --push \
            .
          digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$metadata_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned_image="${image%:*}@$digest"
          docker buildx imagetools inspect --raw "$pinned_image" > "$RUNNER_TEMP/aeb-image-index.json"
          python3 - "$RUNNER_TEMP/aeb-image-index.json" <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              (manifest.get("platform", {}).get("os"), manifest.get("platform", {}).get("architecture"))
              for manifest in index.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          if not required.issubset(platforms):
              raise SystemExit(f"runner image is missing required platforms: {sorted(required - platforms)}")
          PY
          reported_version="$(docker run --rm --platform linux/amd64 "$pinned_image" --version)"
          [[ "$reported_version" == "aeb-gauntlet $version $GITHUB_SHA" ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Runner image: $pinned_image" >> "$GITHUB_STEP_SUMMARY"
          echo "Installed runner: $reported_version" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [release, attest, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release

      - name: Create an owned draft release or resume one on workflow retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_publish.py --tag "$GITHUB_REF_NAME" --dist dist/release

# CodeRabbit configuration.
#
# WHY THIS EXISTS. A corpus repository produces diffs with a shape that defeats
# file-count based review limits: a one-line mechanical edit repeated across
# every case file. PR #139 changed 250 files, of which 214 were an identical
# schema_version bump and 37 carried every actual decision. CodeRabbit skipped
# the review entirely for being over the 100 file limit, so the substantive
# schema, validator, and runner changes got no line-level review at all, and the
# sweep reported zero threads. Zero threads because nobody looked reads exactly
# like zero threads because nothing was wrong.
#
# Splitting such a PR is not available as a fix here. The schema set is
# published as one coordinated generation behind a single active version
# constant, so separating the case files from the profile and result artifacts
# would ship the mixed-version state that design exists to forbid.
#
# So the bulk is excluded from review instead. Everything excluded below is
# machine-generated or mechanically uniform, and is guarded by the validator and
# by make preflight rather than by reading. What remains is the code and
# contract surface where a human or a bot can actually find something.
reviews:
  path_filters:
    # Corpus case fixtures. Every one is schema-validated by `make validate-cases`
    # over the entire directory, and case content is reviewed when a case is
    # authored, not when an unrelated field is bumped across all of them.
    - "!cases/**/*.json"
    - "!cases/**/*.yaml"
    # Generated inventories. Regenerated by `make stats-update`; reviewing them
    # means reviewing the generator's output rather than the generator.
    - "!cases/MANIFEST.txt"
    - "!cases/STATS.md"
    # Frozen conformance evidence. These are recorded artifacts, not fixtures.
    # They are deliberately never edited to satisfy a newer contract, and a
    # change to one is a finding in itself rather than something to review inline.
    - "!control-evidence/v0/conformance/golden/**"
    - "!control-evidence/v0/conformance/edge/**"
    # Published result records, append-only by policy.
    - "!gauntlet-site/results/**"

  # The corpus is the product here, so a walkthrough that lists two hundred
  # fixture paths buries the summary of what actually changed.
  high_level_summary: true
  poem: false
